<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#0F0F12"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="32" height="32" rx="7" fill="url(#rGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#38383E" stroke-width="1"/>

  <!-- Editorial R Lettermark -->
  <text 
    x="13" 
    y="23" 
    font-family="Charter, Georgia, 'Times New Roman', Cambria, serif" 
    font-size="21" 
    font-weight="700" 
    fill="#FAF8F5" 
    text-anchor="middle"
  >R</text>

  <!-- Terracotta Editorial Accent Dot -->
  <circle cx="22.5" cy="21.5" r="2.2" fill="url(#dotGrad)"/>
</svg>
